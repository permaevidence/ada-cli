name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu, Swift container)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y python3 poppler-utils imagemagick procps curl xz-utils
      - name: Install Node.js LTS (nodejs.org, SHASUMS256-verified) for the live Playwright bootstrap check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c 'import json,sys; print(next(e["version"] for e in json.load(sys.stdin) if isinstance(e.get("lts"), str)))')"
          FILE="node-${VERSION}-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/${VERSION}/${FILE}"
          curl -fsSL "https://nodejs.org/dist/${VERSION}/SHASUMS256.txt" | grep " ${FILE}\$" | sha256sum -c -
          mkdir -p /opt/node && tar -xJf "${FILE}" -C /opt/node --strip-components=1
          echo "/opt/node/bin" >> "$GITHUB_PATH"
          /opt/node/bin/node --version
      - name: Build
        run: swift build
      - name: Smoke test
        run: python3 scripts/smoke_test.py .build/debug/briglia
      - name: Install Playwright (browser test of the quick-setup page)
        run: |
          apt-get install -y python3-pip
          python3 -m pip install --break-system-packages playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Quick-setup browser test
        run: python3 scripts/quicksetup_browser_test.py .build/debug/briglia

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build
        run: swift build
      - name: Smoke test
        run: python3 scripts/smoke_test.py .build/debug/briglia
      - name: Quick-setup browser test (best effort on the macOS runner)
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages playwright==1.55.0 || python3 -m pip install playwright==1.55.0
          python3 -m playwright install chromium
          python3 scripts/quicksetup_browser_test.py .build/debug/briglia
