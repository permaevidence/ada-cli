name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu, Swift container)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y python3 poppler-utils imagemagick procps curl
      - name: Build
        run: swift build
      - name: Smoke test
        run: python3 scripts/smoke_test.py .build/debug/ada

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build
        run: swift build
      - name: Smoke test
        run: python3 scripts/smoke_test.py .build/debug/ada
